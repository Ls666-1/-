<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>团队工作管理平台</title>
<script>
  // 防闪烁：在解析 CSS 前应用主题
  (function(){try{var t=localStorage.getItem("wb_team_theme")||"light";document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","light");}})();
</script>
<style>
  :root{
    --bg:#f4f5f8; --surface:#ffffff; --surface-2:#f8f9fb; --surface-3:#eef1f5;
    --ink:#0f172a; --ink-2:#334155; --muted:#64748b; --muted-2:#94a3b8;
    --border:#e8eaee; --border-strong:#d7dbe1;
    --accent:#4f46e5; --accent-ink:#4338ca; --accent-soft:#eef0fe; --accent-soft-2:#e4e6fd;
    --danger:#e11d48; --danger-soft:#fff1f3;
    --warn:#ea580c; --warn-soft:#fff3e9;
    --success:#059669; --success-soft:#e7f6ef;
    --shadow-sm:0 1px 2px rgba(16,24,40,.06);
    --shadow:0 1px 3px rgba(16,24,40,.07),0 1px 2px rgba(16,24,40,.04);
    --shadow-lg:0 16px 40px -12px rgba(16,24,40,.22);
    --radius:14px; --radius-sm:10px; --radius-lg:18px;
    --sidebar:252px;
    --font:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  html[data-theme="dark"]{
    --bg:#0e1117; --surface:#171b22; --surface-2:#1c212a; --surface-3:#222834;
    --ink:#e8ebf1; --ink-2:#b9c1cf; --muted:#8a93a4; --muted-2:#5f6878;
    --border:#272d38; --border-strong:#323a48;
    --accent:#7c83f6; --accent-ink:#9aa0ff; --accent-soft:#20243a; --accent-soft-2:#262a44;
    --danger:#fb7185; --danger-soft:#34202a;
    --warn:#fb923c; --warn-soft:#34281a;
    --success:#34d399; --success-soft:#16301f;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --shadow:0 1px 3px rgba(0,0,0,.4);
    --shadow-lg:0 20px 50px -12px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.55;-webkit-text-size-adjust:100%;font-size:15px;transition:background .3s,color .3s}
  button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:14px;color:inherit}
  input,select,textarea{font-family:inherit;font-size:16px;height:42px;padding:0 12px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--surface);color:var(--ink);min-width:0}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  textarea{height:auto;padding:10px 12px;resize:vertical;line-height:1.5}
  .icon{width:20px;height:20px;display:block}
  .icon-sm{width:16px;height:16px;display:block}

  /* 布局 */
  .app{display:flex;min-height:100vh}
  .sidebar{width:var(--sidebar);flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;transition:background .3s,border-color .3s}
  .brand{padding:20px 18px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border)}
  .logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#8b85f7);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 6px 16px -6px var(--accent)}
  .brand .name{font-weight:700;font-size:15.5px;letter-spacing:.2px}
  .brand .sub{font-size:12px;color:var(--muted)}
  .nav{padding:14px 12px;flex:1;display:flex;flex-direction:column;gap:3px;overflow-y:auto}
  .nav button{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:11px;color:var(--ink-2);font-weight:600;transition:.15s ease;position:relative}
  .nav button:hover{background:var(--surface-2);color:var(--ink)}
  .nav button.active{background:var(--accent-soft);color:var(--accent)}
  .nav button.active::before{content:"";position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:3px;height:22px;background:var(--accent);border-radius:0 3px 3px 0}
  .side-foot{padding:14px 16px;border-top:1px solid var(--border)}
  .mode-badge{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;padding:6px 11px;border-radius:20px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--border)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted-2)}
  .dot.live{background:var(--success);box-shadow:0 0 0 3px var(--success-soft);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  .avatars{display:flex;margin-top:11px;padding-left:4px}
  .avatars .av{width:30px;height:30px;border-radius:50%;border:2px solid var(--surface);margin-left:-8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
  .avatars .av:first-child{margin-left:0}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:saturate(180%) blur(10px);-webkit-backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--border);padding:13px 24px;display:flex;align-items:center;gap:14px}
  .topbar h1{font-size:18px;font-weight:700;letter-spacing:-.2px}
  .topbar .desc{font-size:12px;color:var(--muted);margin-top:1px}
  .spacer{flex:1}
  .acts{display:flex;gap:8px;align-items:center}
  .btn{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 15px;border-radius:11px;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink-2);font-weight:600;transition:.15s}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn.primary:hover{background:var(--accent-ink);color:#fff}
  .btn.ghost{padding:0 11px;border-color:transparent;background:transparent}
  .btn.ghost:hover{background:var(--surface-2);border-color:var(--border)}
  .btn svg{width:18px;height:18px}
  .btn.sm{height:34px;padding:0 12px;font-size:13px}
  .icon-btn{width:40px;height:40px;border-radius:11px;border:1px solid var(--border-strong);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--ink-2);transition:.15s}
  .icon-btn:hover{border-color:var(--accent);color:var(--accent)}
  .icon-btn.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
  .content{padding:24px;max-width:1180px;width:100%;margin:0 auto}

  /* 卡片 */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:18px;transition:background .3s,border-color .3s}
  .card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .card-h h2{font-size:15px;font-weight:700;display:flex;align-items:center;gap:9px}
  .card-h h2 svg{color:var(--accent)}
  .muted{color:var(--muted)}
  .empty{text-align:center;color:var(--muted);padding:36px 16px}
  .empty svg{width:42px;height:42px;color:var(--muted-2);margin-bottom:10px;opacity:.7}
  .empty p{font-size:14px}
  .empty .hint{font-size:12px;margin-top:4px;color:var(--muted-2)}

  /* 今日 */
  .today .item{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--border)}
  .today .item:first-child{border-top:none}
  .ti-main{flex:1;min-width:0}
  .ti-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ti-meta{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:7px;line-height:1.5}
  .pill.over{background:var(--danger-soft);color:var(--danger)}
  .pill.due{background:var(--warn-soft);color:var(--warn)}
  .pill.p0{background:var(--danger-soft);color:var(--danger)}
  .pill.p1{background:var(--warn-soft);color:var(--warn)}
  .pill.p2{background:var(--surface-3);color:var(--muted)}
  .ti-done{height:40px;padding:0 18px;border-radius:10px;background:var(--success);color:#fff;font-weight:700;flex-shrink:0;transition:.15s}
  .ti-done:hover{filter:brightness(.94)}

  /* 表单 */
  form.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
  .grow{flex:1;min-width:150px}

  /* 看板 */
  .board{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .col{background:var(--surface-2);border:1px solid var(--border);border-radius:13px;padding:12px;min-height:140px;transition:background .3s,border-color .3s}
  .col-h{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:12px;padding:0 2px}
  .col-h .cnt{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:0 9px;font-size:12px;color:var(--muted)}
  .col-h .swatch{width:8px;height:8px;border-radius:50%;margin-right:7px;display:inline-block}
  .tcard{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:13px 13px 11px;margin-bottom:10px;box-shadow:var(--shadow-sm);border-left:3px solid transparent;animation:rise .25s ease both;cursor:pointer;transition:border-color .15s,transform .12s,box-shadow .15s}
  .tcard:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
  .tcard.p0{border-left-color:var(--danger)}
  .tcard.p1{border-left-color:var(--warn)}
  .tcard.p2{border-left-color:var(--muted-2)}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .tcard .tt{font-weight:600;font-size:14px;margin-bottom:8px;line-height:1.4}
  .tcard .tm{font-size:12px;color:var(--muted);display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .tcard .badges{display:flex;gap:6px;margin-top:9px;align-items:center;flex-wrap:wrap}
  .tcard .remini{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:7px}
  .tcard .cmtmini{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--muted);background:var(--surface-3);padding:2px 7px;border-radius:7px}
  .tcard .ta{display:flex;gap:6px;margin-top:11px}
  .tcard .ta select{flex:1;height:36px;font-size:13px}
  .del{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);color:var(--danger);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s}
  .del:hover{background:var(--danger-soft);border-color:var(--danger)}

  /* 成员 */
  .mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  .mcard{border:1px solid var(--border);border-radius:13px;padding:16px;display:flex;align-items:center;gap:13px;box-shadow:var(--shadow-sm);background:var(--surface)}
  .av{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:#fff;flex-shrink:0}
  .mname{font-weight:700}
  .mrole{font-size:12px;color:var(--muted)}
  .mload{margin-left:auto;text-align:center}
  .mload b{display:block;font-size:20px;color:var(--accent);font-weight:800;line-height:1}
  .mload span{font-size:11px;color:var(--muted)}

  /* 进度 */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:16px;box-shadow:var(--shadow-sm);text-align:center}
  .stat b{display:block;font-size:26px;font-weight:800;letter-spacing:-.5px}
  .stat span{font-size:12px;color:var(--muted)}
  .charts{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .chartbox{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
  .chartbox h2{font-size:15px;font-weight:700;margin-bottom:16px}
  .bar-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;font-size:13px}
  .bar-row .lbl{width:64px;flex-shrink:0;color:var(--ink-2);font-weight:600}
  .bar-track{flex:1;height:14px;background:var(--surface-3);border-radius:8px;overflow:hidden}
  .bar-fill{height:100%;border-radius:8px;transition:width .5s cubic-bezier(.22,1,.36,1)}
  .bar-row .val{width:30px;text-align:right;font-weight:700;color:var(--ink-2)}

  /* 抽屉 */
  .scrim{position:fixed;inset:0;background:rgba(15,23,42,.42);backdrop-filter:blur(2px);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
  .scrim.show{opacity:1;pointer-events:auto}
  html[data-theme="dark"] .scrim{background:rgba(0,0,0,.55)}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);z-index:61;box-shadow:var(--shadow-lg);transform:translateX(100%);transition:transform .28s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column}
  .drawer.show{transform:none}
  .dh{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:12px}
  .dh .dt{flex:1;min-width:0}
  .dh h3{font-size:16px;font-weight:700;line-height:1.4;word-break:break-word}
  .dh .dm{font-size:12px;color:var(--muted);margin-top:6px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .dbody{flex:1;overflow-y:auto;padding:18px 20px 24px}
  .sec{margin-bottom:22px}
  .sec-t{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:7px}
  .field{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .field label{width:72px;flex-shrink:0;font-size:13px;color:var(--ink-2);font-weight:600}
  .field .ctl{flex:1;display:flex;gap:8px}
  .field select,.field input{flex:1;height:40px;font-size:14px}
  .note-area{width:100%;font-size:14px;min-height:70px}
  .cmt{border:1px solid var(--border);border-radius:11px;padding:11px 13px;margin-bottom:10px;background:var(--surface-2)}
  .cmt .ch{display:flex;align-items:center;gap:8px;margin-bottom:5px}
  .cmt .ca{font-weight:700;font-size:13px}
  .cmt .ct{font-size:11px;color:var(--muted)}
  .cmt .cb{font-size:14px;line-height:1.5;word-break:break-word;white-space:pre-wrap}
  .cmt .cdel{margin-left:auto;color:var(--muted-2);font-size:12px;padding:2px 6px;border-radius:6px}
  .cmt .cdel:hover{color:var(--danger);background:var(--danger-soft)}
  .cmt-form{display:flex;gap:8px;margin-top:10px}
  .cmt-form input{flex:1;height:40px}
  .rem-row{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border:1px solid var(--border);border-radius:11px;margin-bottom:10px;background:var(--surface-2)}
  .rem-row .rl{font-weight:600;font-size:14px}
  .rem-row .rd{font-size:12px;color:var(--muted);margin-top:2px}
  .switch{position:relative;width:44px;height:26px;flex-shrink:0;cursor:pointer}
  .switch input{opacity:0;width:0;height:0}
  .switch .sl{position:absolute;inset:0;background:var(--muted-2);border-radius:20px;transition:.2s}
  .switch .sl::before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:var(--shadow-sm)}
  .switch input:checked + .sl{background:var(--accent)}
  .switch input:checked + .sl::before{transform:translateX(18px)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 12px}
  .chip{font-size:13px;font-weight:600;padding:7px 13px;border-radius:20px;border:1px solid var(--border-strong);color:var(--ink-2);background:var(--surface);cursor:pointer;transition:.15s;user-select:none}
  .chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .dn-row{display:flex;gap:8px;margin-top:8px}
  .dn-row .btn{flex:1;justify-content:center}

  /* toast */
  .toasts{position:fixed;right:18px;bottom:18px;z-index:80;display:flex;flex-direction:column;gap:10px;max-width:340px}
  .toast{background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-lg);border-radius:13px;padding:13px 15px;display:flex;gap:11px;align-items:flex-start;animation:tin .3s ease both;cursor:pointer}
  .toast .ti{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--accent-soft);color:var(--accent)}
  .toast.warn .ti{background:var(--warn-soft);color:var(--warn)}
  .toast.danger .ti{background:var(--danger-soft);color:var(--danger)}
  .toast .tc .ttl{font-weight:700;font-size:14px}
  .toast .tc .tmsg{font-size:13px;color:var(--ink-2);margin-top:2px;line-height:1.45}
  @keyframes tin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

  /* 移动端 */
  .mobile-tab{display:none}
  @media(max-width:860px){
    .sidebar{display:none}
    .content{padding:16px;padding-bottom:92px}
    .charts{grid-template-columns:1fr}
    .stats{grid-template-columns:repeat(2,1fr)}
    .board{grid-template-columns:1fr}
    .topbar{padding:12px 16px;gap:10px}
    .topbar .desc{display:none}
    .btn span.txt{display:none}
    .btn{padding:0 12px}
    .mobile-tab{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--border);padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
    .mobile-tab button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;border-radius:10px;color:var(--muted);font-size:11px;font-weight:600}
    .mobile-tab button.active{color:var(--accent);background:var(--accent-soft)}
  }
  @media(max-width:480px){.topbar h1{font-size:16px}.acts .btn span.txt{display:none}.icon-btn{width:38px;height:38px}}
  .hidden{display:none!important}
  .card-h .sub{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}
  .hint{font-size:12.5px;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:9px 12px;margin:4px 0 14px;line-height:1.5}
  .hcard{border:1px solid var(--border);border-radius:12px;padding:13px 15px;margin-bottom:10px;background:var(--surface);transition:.15s}
  .hcard:hover{border-color:var(--border-strong);box-shadow:var(--shadow-sm)}
  .hcard .ht{display:flex;align-items:center;gap:9px;margin-bottom:7px}
  .hcard .ht-title{font-weight:650;font-size:14.5px}
  .hcard .hm{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-bottom:11px}
  .hcard .ha{display:flex;gap:8px}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      </div>
      <div>
        <div class="name">团队工作台</div>
        <div class="sub">产品研发组</div>
      </div>
    </div>
    <nav class="nav" id="nav">
      <button data-tab="board" class="active">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="3" width="7" height="11" rx="1"/></svg>任务看板
      </button>
      <button data-tab="members">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/></svg>成员分工
      </button>
      <button data-tab="progress">

<script>
"use strict";
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => (s == null ? "" : String(s)).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function fmtDate(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");return `${y}-${m}-${day}`;}
function todayStr(){return fmtDate(new Date());}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function hue(str){let h=0;for(let i=0;i<str.length;i++)h=(h*31+str.charCodeAt(i))%360;return h;}
function avatarColor(name){const h=hue(name||"?");return {bg:`hsl(${h} 55% 55%)`};}
function nowLocalInput(){const d=new Date(Date.now()+600000);const p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;}
function fmtRemTime(s){if(!s)return"";const d=new Date(s);const p=n=>String(n).padStart(2,"0");return `${d.getMonth()+1}月${d.getDate()}日 ${p(d.getHours())}:${p(d.getMinutes())}`;}

/* ---------- 双模式数据存储 ---------- */
const Store = (function(){
  const LS_T="wb_team_tasks", LS_M="wb_team_members", LS_H="wb_team_history", LS_SEED="wb_team_seeded";
  let mode="local", listeners=[], cache={tasks:[],members:[],history:[]}, sse=null;

  function emit(){listeners.forEach(l=>l(cache));}
  function subscribe(cb){listeners.push(cb);return ()=>{listeners=listeners.filter(x=>x!==cb);};}
  function set(s){cache=s;emit();}

  async function init(){
    try{
      const r=await fetch("/api/state",{headers:{Accept:"application/json"}});
      if(!r.ok) throw 0;
      const s=await r.json();
      mode="api"; set({tasks:s.tasks||[],members:s.members||[],history:s.history||[]});
      sse=new EventSource("/api/events");
      sse.onmessage=e=>{try{const p=JSON.parse(e.data);if(p.state)set({tasks:p.state.tasks||[],members:p.state.members||[],history:p.state.history||[]});}catch(_){}};
    }catch(_){ mode="local"; loadLocal(); }
    return mode;
  }
  function loadLocal(){
    try{cache.tasks=JSON.parse(localStorage.getItem(LS_T))||[];}catch(e){cache.tasks=[];}
    try{cache.members=JSON.parse(localStorage.getItem(LS_M))||[];}catch(e){cache.members=[];}
    try{cache.history=JSON.parse(localStorage.getItem(LS_H))||[];}catch(e){cache.history=[];}
    if(!localStorage.getItem(LS_SEED)){seedLocal();localStorage.setItem(LS_SEED,"1");}
    set(cache);
  }
  function saveLocal(){localStorage.setItem(LS_T,JSON.stringify(cache.tasks));localStorage.setItem(LS_M,JSON.stringify(cache.members));localStorage.setItem(LS_H,JSON.stringify(cache.history));}
  function baseTask(t,due){return {id:uid(),title:t.title,owner:t.owner||"",priority:t.priority||"P1",due:t.due||due,status:t.status||"待办",note:t.note||"",comments:t.comments||[],reminder:t.reminder||{enabled:false,at:null,channels:{inapp:true,browser:false,dingtalk:false},notified:false}};}
  function seedLocal(){
    const t=new Date(),y=new Date(t);y.setDate(y.getDate()-1);const tm=new Date(t);tm.setDate(t.getDate()+2);
    cache.tasks=[
      baseTask({title:"整理 Q3 产品需求文档",owner:"张三",priority:"P0",due:fmtDate(y),status:"待办"},fmtDate(y)),
      baseTask({title:"首页改版视觉稿评审",owner:"李四",priority:"P1",due:todayStr(),status:"进行中"},todayStr()),
      baseTask({title:"接口联调与提测",owner:"王五",priority:"P1",due:fmtDate(tm),status:"待办"},fmtDate(tm)),
      baseTask({title:"本周站会纪要同步",owner:"张三",priority:"P2",due:todayStr(),status:"待办"},todayStr()),
    ];
    cache.members=[
      {id:uid(),name:"张三",role:"产品经理"},
      {id:uid(),name:"李四",role:"前端开发"},
      {id:uid(),name:"王五",role:"测试工程师"},
    ];
    saveLocal();
  }

  async function addTask(t){
    const nt=baseTask(t,todayStr());
    if(mode==="api"){
      const r=await fetch("/api/task",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(nt)});
      const j=await r.json(); if(j.ok) set({tasks:[...cache.tasks,j.task],members:cache.members});
    }else{cache.tasks.push(nt);saveLocal();set(cache);}
  }
  async function updateTask(id,patch){
    if(mode==="api"){
      const r=await fetch("/api/task/"+id,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(patch)});
      const j=await r.json(); if(j.ok) set({tasks:cache.tasks.map(x=>x.id===id?j.task:x),members:cache.members});
    }else{
      const becameDone = patch.status==="已完成";
      cache.tasks=cache.tasks.map(x=>{ if(x.id!==id) return x; const nx={...x,...patch}; if(becameDone){nx.completedAt=Date.now(); archiveLocal(nx);} return nx; });
      saveLocal();set(cache);
    }
  }
  async function deleteTask(id){
    if(mode==="api"){
      const r=await fetch("/api/task/"+id,{method:"DELETE"});const j=await r.json();
      if(j.ok) set({tasks:cache.tasks.filter(x=>x.id!==id),members:cache.members});
    }else{
      const t=cache.tasks.find(x=>x.id===id);
      if(t&&t.status==="已完成") archiveLocal(t);
      cache.tasks=cache.tasks.filter(x=>x.id!==id);saveLocal();set(cache);
    }
  }
  function archiveLocal(t){
    if(!t)return;
    const snap={id:"h-"+t.id,taskId:t.id,title:t.title,owner:t.owner,priority:t.priority,due:t.due,note:t.note||"",comments:t.comments||[],completedAt:t.completedAt||Date.now()};
    const i=cache.history.findIndex(h=>h.taskId===t.id);
    if(i>=0)cache.history[i]=snap; else cache.history.unshift(snap);
  }
  async function addMember(m){
    if(mode==="api"){
      const r=await fetch("/api/member",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(m)});
      const j=await r.json(); if(j.ok) set({tasks:cache.tasks,members:[...cache.members,j.member]});
    }else{const nm={id:uid(),...m};cache.members.push(nm);saveLocal();set(cache);}
  }
  async function deleteMember(id){
    if(mode==="api"){
      const r=await fetch("/api/member/"+id,{method:"DELETE"});const j=await r.json();
      if(j.ok) set({tasks:cache.tasks,members:cache.members.filter(x=>x.id!==id)});
    }else{cache.members=cache.members.filter(x=>x.id!==id);saveLocal();set(cache);}
  }
  async function addComment(taskId,author,text){
    const t=cache.tasks.find(x=>x.id===taskId); if(!t)return;
    const c={id:uid(),author:author||"我",text:text,ts:Date.now()};
    const comments=[...(t.comments||[]),c];
    await updateTask(taskId,{comments});
  }
  async function deleteComment(taskId,cid){
    const t=cache.tasks.find(x=>x.id===taskId); if(!t)return;
    const comments=(t.comments||[]).filter(c=>c.id!==cid);
    await updateTask(taskId,{comments});
  }
  async function setReminder(taskId,rem){ await updateTask(taskId,{reminder:rem}); }
  async function markNotified(taskId){
    const t=cache.tasks.find(x=>x.id===taskId); if(!t||!t.reminder)return;
    await updateTask(taskId,{reminder:{...t.reminder,notified:true}});
  }
  async function pushDingtalk(taskId,kind){
    if(mode==="api"){
      const r=await fetch("/api/task/"+taskId+"/dingtalk",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({kind})});
      const j=await r.json(); return j;
    }else{ return {ok:false,code:"local"}; }
  }
  async function clearAll(){
    if(mode==="api"){
      for(const t of [...cache.tasks]) await fetch("/api/task/"+t.id,{method:"DELETE"});
      for(const m of [...cache.members]) await fetch("/api/member/"+m.id,{method:"DELETE"});
      for(const h of [...cache.history]) await fetch("/api/history/"+h.id,{method:"DELETE"});
    }else{cache.tasks=[];cache.members=[];cache.history=[];saveLocal();set(cache);}
  }
  async function deleteHistory(id){
    if(mode==="api"){ await fetch("/api/history/"+id,{method:"DELETE"}); }
    else{ cache.history=cache.history.filter(h=>h.id!==id); saveLocal(); set(cache); }
  }
  async function restoreHistory(id){
    if(mode==="api"){
      const r=await fetch("/api/history/"+id+"?restore",{method:"POST"});const j=await r.json();
      if(j.ok) set({tasks:[...cache.tasks,j.task],members:cache.members,history:cache.history.filter(h=>h.id!==id)});
    }else{
      const h=cache.history.find(x=>x.id===id); if(!h)return;
      const restored={id:h.taskId&&cache.tasks.every(t=>t.id!==h.taskId)?h.taskId:uid(),title:h.title,owner:h.owner,priority:h.priority,due:h.due,note:h.note,comments:h.comments||[],status:"已完成",completedAt:h.completedAt};
      cache.tasks.push(restored); cache.history=cache.history.filter(x=>x.id!==id); saveLocal(); set(cache);
    }
  }
  function exportData(){
    const data={_type:"team-work-platform",_v:3,tasks:cache.tasks,members:cache.members,history:cache.history,exportedAt:new Date().toISOString()};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download="团队工作台-备份-"+todayStr()+".json";a.click();URL.revokeObjectURL(a.href);
  }
  async function importData(obj){
    if(!obj||!Array.isArray(obj.tasks)) throw new Error("格式不正确");
    const norm=obj.tasks.map(t=>baseTask(t,t.due||todayStr()));
    if(mode==="api"){
      for(const t of norm) await fetch("/api/task",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(t)});
      for(const m of obj.members||[]) await fetch("/api/member",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(m)});
    }else{cache.tasks=norm;cache.members=obj.members||[];cache.history=Array.isArray(obj.history)?obj.history:[];saveLocal();set(cache);}
  }

  return {init,subscribe,addTask,updateTask,deleteTask,addMember,deleteMember,addComment,deleteComment,setReminder,markNotified,pushDingtalk,clearAll,deleteHistory,restoreHistory,exportData,importData,
    get mode(){return mode;}, get state(){return cache;}};
})();

function checkReminders(){
  const now=Date.now();
  Store.state.tasks.forEach(t=>{
    const r=t.reminder;
    if(r&&r.enabled&&r.at&&!r.notified&&new Date(r.at).getTime()<=now){
      const ch=r.channels||{inapp:true};
      if(ch.inapp) toast("提醒 · "+t.title,"该任务到提醒时间了（负责人："+t.owner+"）","warn");
      if(ch.browser&&Notification&&Notification.permission==="granted"){new Notification("团队工作台 · 任务提醒",{body:t.title+"（负责人："+t.owner+"）",tag:t.id});}
      Store.markNotified(t.id);
    }
  });
}
function toast(title,msg,kind){
  const box=$("#toasts");
  const el=document.createElement("div");
  el.className="toast"+(kind?" "+kind:"");
  const icon = kind==="danger" ? '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>'
    : kind==="warn" ? '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>'
    : '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>';
  el.innerHTML=`<div class="ti">${icon}</div><div class="tc"><div class="ttl">${esc(title)}</div><div class="tmsg">${esc(msg||"")}</div></div>`;
  el.onclick=()=>{el.remove();if(openTaskId)return;};
  box.appendChild(el);
  setTimeout(()=>{el.style.opacity="0";el.style.transform="translateY(8px)";setTimeout(()=>el.remove(),250);},5200);
}

document.addEventListener("keydown",e=>{if(e.key==="Escape"&&openTaskId)closeDrawer();});
// 抽屉内编辑
$("#dStatus").onchange=e=>openTaskId&&Store.updateTask(openTaskId,{status:e.target.value});
$("#dOwner").onchange=e=>openTaskId&&Store.updateTask(openTaskId,{owner:e.target.value});
$("#dPriority").onchange=e=>openTaskId&&Store.updateTask(openTaskId,{priority:e.target.value});
$("#dDue").onchange=e=>openTaskId&&Store.updateTask(openTaskId,{due:e.target.value});
$("#dNote").onchange=e=>openTaskId&&Store.updateTask(openTaskId,{note:e.target.value});
$("#dCmtSend").onclick=()=>{const v=$("#dCmtInput").value.trim();if(!v||!openTaskId)return;Store.addComment(openTaskId,"我",v).then(()=>{$("#dCmtInput").value="";const t=Store.state.tasks.find(x=>x.id===openTaskId);if(t)renderComments(t);});};
$("#dCmtInput").onkeydown=e=>{if(e.key==="Enter"){$("#dCmtSend").click();e.preventDefault();}};
// 提醒开关与设置
$("#dRemOn").onchange=()=>{
  const rem=getReminder();
  $("#dRemBody").classList.toggle("hidden",!rem.enabled);
  $("#dRemDesc").textContent=rem.enabled&&rem.at?("将在 "+fmtRemTime(rem.at)+" 提醒"):"未设置";
  if(openTaskId)Store.setReminder(openTaskId,rem);
};
$("#dRemAt").onchange=()=>{
  const rem=getReminder();
  $("#dRemDesc").textContent=rem.enabled&&rem.at?("将在 "+fmtRemTime(rem.at)+" 提醒"):"未设置";
  if(openTaskId)Store.setReminder(openTaskId,rem);
};
$$("#dRemChips .chip").forEach(ch=>ch.onclick=()=>{ch.classList.toggle("on");if(openTaskId)Store.setReminder(openTaskId,getReminder());});
// 钉钉同步
async function doPush(kind){
  if(!openTaskId)return;
  const t=Store.state.tasks.find(x=>x.id===openTaskId); if(!t)return;
  toast("正在同步到钉钉…",(kind==="todo"?"待办":"日历")+"："+t.title,"");
  const res=await Store.pushDingtalk(openTaskId,kind);
  if(res&&res.ok){toast("已同步到钉钉",(kind==="todo"?"待办":"日历")+"创建成功","");}
  else if(res&&res.code==="local"){
    // 本地模式：深链唤起 + 复制
    dingtalkDeepLink();
    const text=dingtalkLocalText(t);
    try{await navigator.clipboard.writeText(text);toast("已唤起钉钉并复制内容","在钉钉中粘贴即可创建"+(kind==="todo"?"待办":"日程"),"");}
    catch(e){toast("已唤起钉钉","请手动复制："+t.title,"");}
  }else{toast("同步未成功",(res&&res.message)||(res&&res.error)||"请检查后端钉钉配置","danger");}
}
$("#dPushTodo").onclick=()=>doPush("todo");
$("#dPushCal").onclick=()=>doPush("cal");

/* ---------- 启动 ---------- */
Store.subscribe(()=>renderAll());
Store.init().then(()=>{
  renderAll();setTab("board");$("#tDue").value=todayStr();
  applyTheme(document.documentElement.getAttribute("data-theme")||"light");
  if("Notification" in window && Notification.permission==="granted")$("#btnNotify").classList.add("on");
  checkReminders();
  setInterval(checkReminders,20000);
});
</script>
</body>
</html>
